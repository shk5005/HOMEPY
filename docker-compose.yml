services:
  typedb:
    image: vaticle/typedb:2.28.0
    container_name: homepy-typedb
    ports:
      - "1729:1729"
    volumes:
      - typedb_data:/opt/typedb-all-linux-x86_64/server/data
    healthcheck:
      # TCP check that the server accepts connections on 1729
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/1729'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: homepy-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: homepy
      POSTGRES_USER: homepy
      POSTGRES_PASSWORD: homepy
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homepy -d homepy"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  typedb_data:
  timescale_data:
