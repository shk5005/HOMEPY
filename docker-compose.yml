services:
  neo4j:
    image: neo4j:5-community
    container_name: homepy-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/homepy
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  neo4j-standby:
    image: neo4j:5-community
    container_name: homepy-neo4j-standby
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/homepy
    volumes:
      - neo4j-standby-data:/data
      - backup-data:/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: homepy-etcd
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  timescale-primary:
    image: timescale/timescaledb-ha:pg16
    container_name: homepy-timescale-primary
    hostname: timescale-primary
    # Patroni ships in the timescaledb-ha image
    command: ["patroni", "/etc/patroni/patroni.yml"]
    ports:
      - "5432:5432"
      - "8008:8008"
    depends_on:
      etcd:
        condition: service_healthy
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - wal-archive:/wal-archive
      - ./deploy/patroni/patroni-primary.yml:/etc/patroni/patroni.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homepy -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  timescale-replica:
    image: timescale/timescaledb-ha:pg16
    container_name: homepy-timescale-replica
    hostname: timescale-replica
    command: ["patroni", "/etc/patroni/patroni.yml"]
    ports:
      - "5433:5432"
      - "8009:8008"
    depends_on:
      timescale-primary:
        condition: service_healthy
    volumes:
      - timescale_replica_data:/var/lib/postgresql/data
      - wal-archive:/wal-archive
      - ./deploy/patroni/patroni-replica.yml:/etc/patroni/patroni.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homepy -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis-master:
    image: redis:7-alpine
    container_name: homepy-redis-master
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica:
    image: redis:7-alpine
    container_name: homepy-redis-replica
    command: ["redis-server", "--replicaof", "redis-master", "6379"]
    depends_on:
      - redis-master

  redis-sentinel-1: &sentinel
    image: redis:7-alpine
    container_name: homepy-redis-sentinel-1
    # Sentinel rewrites its config; copy the mounted template first
    command: ["sh", "-c", "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"]
    volumes:
      - ./deploy/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis-master
      - redis-replica

  redis-sentinel-2:
    <<: *sentinel
    container_name: homepy-redis-sentinel-2

  redis-sentinel-3:
    <<: *sentinel
    container_name: homepy-redis-sentinel-3

  nginx:
    image: nginx:1.25
    container_name: homepy-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  keycloak-db:
    image: postgres:16
    container_name: homepy-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: homepy-keycloak
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy

volumes:
  neo4j_data:
  timescale_data:
  timescale_replica_data:
  wal-archive:
  neo4j-standby-data:
  redis-data:
  backup-data:
  keycloak-db-data:
