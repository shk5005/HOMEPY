<title>지니 주식투자비서</title>
<meta name="description" content="일반 투자자가 빠지는 함정 5가지를 AI가 강제 차단하도록 설계한 주식 분석 파이프라인.">
<style>
:root{
  --navy-900:#0b1626;
  --navy-800:#101f35;
  --navy-700:#16293f;
  --navy-600:#1e3550;
  --navy-500:#2a4463;
  --line:#24384f;

  --cream:#faf7f1;
  --cream-2:#f3ece0;
  --paper:#ffffff;

  --gold:#e8a92c;
  --gold-2:#f4c65e;
  --gold-dim:#9a7220;

  --bull:#2fa36b;
  --base:#3d82d4;
  --bear:#d9534f;
  --warn:#e0a02c;

  --ink:#14202f;
  --ink-2:#41546b;
  --ink-3:#7b8ca1;
  --on-dark:#e8eef6;
  --on-dark-2:#9db0c7;

  --r-s:8px; --r-m:12px; --r-l:18px; --r-xl:26px;
  --shadow:0 8px 28px rgba(8,18,32,.14);
  --shadow-lg:0 18px 50px rgba(8,18,32,.22);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",
         "Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:var(--cream);
  color:var(--ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit}
table{border-collapse:collapse;width:100%}

.app{display:flex;min-height:100vh}

.sidebar{
  width:250px;flex:0 0 250px;
  background:var(--navy-900);color:var(--on-dark);
  padding:22px 14px 40px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
.brand-mark{
  width:40px;height:40px;border-radius:12px;flex:0 0 40px;
  background:linear-gradient(145deg,var(--gold-2),var(--gold-dim));
  display:grid;place-items:center;font-size:21px;
  box-shadow:0 4px 14px rgba(232,169,44,.35);
}
.brand-name{font-size:19px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.brand-sub{font-size:10.5px;color:var(--on-dark-2);letter-spacing:.2px}

.nav-group-label{
  font-size:10px;font-weight:700;letter-spacing:1.4px;
  color:#5f748e;padding:16px 10px 7px;text-transform:uppercase;
}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 11px;border-radius:var(--r-s);
  color:var(--on-dark-2);font-size:13.5px;font-weight:600;
  text-align:left;transition:background .13s,color .13s;
}
.nav-item:hover{background:var(--navy-700);color:var(--on-dark)}
.nav-item.active{background:var(--gold);color:#20160a;font-weight:800}
.nav-item .ico{width:18px;text-align:center;font-size:14px}
.nav-step{
  margin-left:auto;font-size:10px;font-family:var(--mono);
  opacity:.65;font-weight:700;
}
.nav-item.done .nav-step::after{content:" \002713";color:var(--bull)}
.nav-item.active.done .nav-step::after{color:#1c5c3c}

.main{flex:1;min-width:0;padding:30px 38px 90px;max-width:1180px}

.page-eyebrow{
  font-size:11px;font-weight:800;letter-spacing:1.6px;
  color:var(--gold-dim);text-transform:uppercase;margin-bottom:7px;
}
.page-title{font-size:29px;font-weight:800;letter-spacing:-.8px;margin:0 0 7px}
.page-desc{color:var(--ink-2);font-size:14px;margin:0 0 26px;max-width:70ch}

.card{
  background:var(--paper);border:1px solid #e6ddcd;border-radius:var(--r-l);
  padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow);
}
.card-dark{
  background:var(--navy-800);border:1px solid var(--line);color:var(--on-dark);
  border-radius:var(--r-l);padding:22px 24px;margin-bottom:18px;
}
.card-dark .card-title{color:#fff}
.card-title{
  font-size:16px;font-weight:800;margin:0 0 4px;
  display:flex;align-items:center;gap:8px;letter-spacing:-.3px;
}
.card-sub{font-size:12.5px;color:var(--ink-3);margin:0 0 16px}
.card-dark .card-sub{color:var(--on-dark-2)}

.rail{display:grid;grid-template-columns:78px 1fr;gap:2px 16px;margin:14px 0 4px}
.rail dt{
  font-size:10px;font-weight:800;letter-spacing:1.3px;color:var(--gold-dim);
  padding-top:3px;
}
.rail dd{margin:0 0 13px;font-size:13px;color:var(--ink-2)}

.chip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.chip{
  padding:9px 12px;border-radius:10px;border:1.5px solid #dfd6c6;
  background:var(--paper);font-size:13px;font-weight:600;color:var(--ink-2);
  text-align:center;transition:all .13s;
}
.chip:hover{border-color:var(--navy-500);color:var(--ink)}
.chip[aria-pressed="true"]{
  background:var(--navy-800);border-color:var(--navy-800);color:#fff;font-weight:700;
}
.field{margin-bottom:20px}
.field-label{
  font-size:12px;font-weight:800;color:var(--ink);margin-bottom:8px;
  display:flex;align-items:center;gap:7px;
}
.field-hint{font-weight:500;color:var(--ink-3);font-size:11px}

.input,.textarea,.select{
  width:100%;padding:10px 13px;border:1.5px solid #ddd3c2;border-radius:10px;
  background:var(--paper);font-size:13.5px;transition:border-color .13s;
}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--gold)}
.textarea{min-height:120px;resize:vertical;line-height:1.55}
.textarea.code{font-family:var(--mono);font-size:12px}

.btn{
  padding:11px 20px;border-radius:11px;font-weight:800;font-size:13.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .1s,filter .13s,box-shadow .13s;
}
.btn:active{transform:translateY(1px)}
.btn-gold{background:var(--gold);color:#20160a;box-shadow:0 3px 12px rgba(232,169,44,.32)}
.btn-gold:hover{filter:brightness(1.06)}
.btn-navy{background:var(--navy-800);color:#fff}
.btn-navy:hover{background:var(--navy-700)}
.btn-ghost{background:transparent;border:1.5px solid #ddd3c2;color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--navy-500);color:var(--ink)}
.btn-block{width:100%}
.btn-lg{padding:15px 26px;font-size:15px;border-radius:13px}
.btn-sm{padding:7px 13px;font-size:12px;border-radius:9px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

.trap-hero{
  background:linear-gradient(140deg,#1a0f14,#3a1a1c 55%,#1d1013);
  border-radius:var(--r-xl);padding:28px 30px;margin-bottom:20px;color:#fff;
  box-shadow:var(--shadow-lg);
}
.trap-hero h2{
  margin:0 0 3px;font-size:24px;font-weight:900;letter-spacing:-.7px;
  color:var(--gold-2);
}
.trap-hero p{margin:0 0 20px;font-size:13px;color:#d7c4b6}
.trap-row{
  display:grid;grid-template-columns:26px 1fr 26px 1fr;gap:9px;
  align-items:center;margin-bottom:8px;
}
.trap-n{
  width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.09);
  display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--gold-2);
}
.trap-bad{
  background:rgba(255,255,255,.07);padding:8px 13px;border-radius:9px;
  font-size:13px;font-weight:600;
}
.trap-arrow{text-align:center;color:var(--gold);font-size:13px}
.trap-fix{
  background:rgba(232,169,44,.13);border:1px solid rgba(232,169,44,.3);
  padding:8px 13px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--gold-2);
}

.step-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:13px}
.step-card{
  background:var(--paper);border:1px solid #e6ddcd;border-radius:var(--r-m);
  padding:19px 17px;text-align:center;position:relative;transition:all .15s;
}
.step-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--shadow)}
.step-card .emo{font-size:25px;display:block;margin-bottom:7px}
.step-card .t{font-size:14.5px;font-weight:800;letter-spacing:-.3px}
.step-card .d{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.45}
.step-card .badge{
  position:absolute;top:9px;right:9px;background:var(--navy-800);color:#fff;
  font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.3px;
}
.step-card.done .badge{background:var(--bull)}

.tbl-wrap{overflow-x:auto;border-radius:var(--r-m);border:1px solid var(--line)}
.tbl{font-size:12.5px;min-width:520px}
.tbl thead th{
  background:var(--navy-800);color:#fff;font-weight:700;text-align:left;
  padding:10px 13px;white-space:nowrap;font-size:11.5px;letter-spacing:.2px;
}
.tbl tbody td{padding:10px 13px;border-top:1px solid #e9e2d5;background:var(--paper)}
.tbl tbody tr:hover td{background:#fdfbf7}
.tbl .num{font-family:var(--mono);text-align:right;white-space:nowrap;font-size:12px}
.tbl .name{font-weight:700;white-space:nowrap}

.sc-bull{color:var(--bull);font-weight:700}
.sc-base{color:var(--base);font-weight:700}
.sc-bear{color:var(--bear);font-weight:700}
.pos{color:var(--bull);font-weight:700}
.neg{color:var(--bear);font-weight:700}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin:16px 0}
.stat{
  background:var(--navy-800);border:1px solid var(--line);border-radius:var(--r-m);
  padding:14px 16px;color:var(--on-dark);
}
.stat .k{font-size:10.5px;color:var(--on-dark-2);font-weight:700;letter-spacing:.4px}
.stat .v{font-size:22px;font-weight:800;font-family:var(--mono);margin-top:3px;letter-spacing:-.8px}
.stat .n{font-size:10.5px;color:#6f849c;margin-top:2px}

.prompt-box{
  background:#fffdf8;border:1.5px solid var(--gold);border-radius:var(--r-m);
  padding:0;overflow:hidden;margin-top:14px;
}
.prompt-head{
  background:rgba(232,169,44,.14);padding:10px 15px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px solid rgba(232,169,44,.35);
}
.prompt-head .t{font-size:12.5px;font-weight:800;color:#7a5a12}
.prompt-body{
  padding:16px 18px;font-family:var(--mono);font-size:11.5px;line-height:1.75;
  white-space:pre-wrap;word-break:break-word;max-height:460px;overflow-y:auto;color:#2b3648;
}
.prompt-foot{
  background:#fdf6e6;padding:9px 15px;font-size:11px;color:#8a6a1e;
  border-top:1px solid rgba(232,169,44,.28);
}

.alert{
  padding:12px 15px;border-radius:var(--r-s);font-size:12.5px;
  display:flex;gap:9px;align-items:flex-start;margin:12px 0;line-height:1.55;
}
.alert-warn{background:#fdf3e0;border:1px solid #e8c98a;color:#7d5b12}
.alert-info{background:#eaf1fb;border:1px solid #b7cdec;color:#2a4c7d}
.alert-ok{background:#e8f6ee;border:1px solid #a5d9bd;color:#1d6640}
.alert-bad{background:#fbeceb;border:1px solid #eab5b2;color:#8d2b27}

.tickers{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0}
.tk{
  display:inline-flex;align-items:center;gap:7px;padding:6px 11px;
  border-radius:20px;border:1.5px solid #d6ccb9;background:var(--paper);
  font-size:12.5px;font-weight:700;
}
.tk .x{color:var(--ink-3);font-weight:800;font-size:14px;line-height:1}
.tk .x:hover{color:var(--bear)}
.tk.hit3{border-color:var(--bull);background:#eef9f3;color:#1d6640}
.tk.hit2{border-color:var(--warn);background:#fdf6e6;color:#7d5b12}

.moat-cell{font-size:12px;font-weight:700}
.m-strong{color:var(--bull)}
.m-mid{color:var(--warn)}
.m-weak{color:var(--bear)}

.bar{height:7px;background:#e8e0d0;border-radius:20px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:20px}

.wbar{height:22px;border-radius:6px;display:flex;overflow:hidden;margin:8px 0 14px;border:1px solid var(--line)}
.wbar > span{display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;white-space:nowrap}

.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.split-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.muted{color:var(--ink-3);font-size:12px}
.hidden{display:none !important}
.mono{font-family:var(--mono)}
.right{text-align:right}
.mt{margin-top:16px}
.mb0{margin-bottom:0}
hr.sep{border:none;border-top:1px solid #e9e2d5;margin:20px 0}

.ai-col{border-radius:var(--r-m);border:2px solid;padding:14px;background:var(--paper)}
.ai-col h4{margin:0 0 3px;font-size:13.5px;font-weight:800;display:flex;gap:7px;align-items:center}
.ai-col .cnt{font-size:11px;color:var(--ink-3);margin-bottom:9px}
.ai-gpt{border-color:#10a37f}   .ai-gpt h4{color:#0c8163}
.ai-claude{border-color:#d97757} .ai-claude h4{color:#b85c3f}
.ai-plx{border-color:#20808d}   .ai-plx h4{color:#186670}

.badge-pill{
  display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;
  font-weight:800;letter-spacing:.2px;
}
.bp-gold{background:rgba(232,169,44,.18);color:#7a5a12}
.bp-green{background:#e8f6ee;color:#1d6640}
.bp-red{background:#fbeceb;color:#8d2b27}
.bp-navy{background:var(--navy-800);color:#fff}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--navy-900);color:#fff;padding:12px 22px;border-radius:12px;
  font-size:13px;font-weight:700;box-shadow:var(--shadow-lg);
  opacity:0;transition:all .25s;z-index:99;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:relative;padding:16px 12px 20px}
  .main{padding:22px 16px 70px}
  .split,.split-3{grid-template-columns:1fr}
  .trap-row{grid-template-columns:24px 1fr;gap:7px}
  .trap-arrow{display:none}
  .trap-fix{grid-column:2}
}

.quote-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 12px;margin:10px 0 14px;
  background:#f7f2e8;border:1px solid #e6ddcd;border-radius:var(--r-m);
}
.quote-badge{
  font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;
  background:#fff;border:1.5px solid #ddd3c2;color:var(--ink-2);cursor:pointer;
  white-space:nowrap;
}
.quote-badge.ok{border-color:var(--bull);background:#eef9f3;color:#1d6640}
.quote-badge.off{border-color:#e0c08a;background:#fdf6e6;color:#8a6a1e}
.quote-badge.err{border-color:var(--bear);background:#fbeceb;color:#8d2b27}
#quote-msg{flex:1;min-width:160px}

.qs-list{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 12px}
.qs-item{
  padding:7px 12px;border-radius:20px;border:1.5px solid #d6ccb9;background:#fff;
  font-size:12.5px;font-weight:700;transition:all .13s;
}
.qs-item:hover{border-color:var(--gold);background:#fffdf8}
.qs-item .code{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:6px}
</style>
