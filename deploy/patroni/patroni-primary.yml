scope: homepy-cluster
name: timescale-primary

restapi:
  listen: 0.0.0.0:8008
  connect_address: timescale-primary:8008

etcd3:
  host: etcd:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    synchronous_mode: true
    synchronous_mode_strict: false
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        wal_keep_size: 512MB
        archive_mode: "on"
        archive_command: "test ! -f /wal-archive/%f && cp %p /wal-archive/%f"
        shared_preload_libraries: timescaledb
  initdb:
    - encoding: UTF8
    - data-checksums
  pg_hba:
    - host replication replicator 0.0.0.0/0 md5
    - host all all 0.0.0.0/0 md5

postgresql:
  listen: 0.0.0.0:5432
  connect_address: timescale-primary:5432
  data_dir: /var/lib/postgresql/data/pgdata
  authentication:
    superuser:
      username: homepy
      password: homepy
    replication:
      username: replicator
      password: replicator

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
