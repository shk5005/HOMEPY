apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  CACHE_TTL_SECONDS: {{ .Values.config.cacheTtlSeconds | quote }}
  NEO4J_HOST: {{ .Release.Name }}-neo4j
  NEO4J_BOLT_PORT: {{ .Values.neo4j.boltPort | quote }}
  NEO4J_DATABASE: {{ .Values.config.neo4jDatabase | quote }}
  TIMESCALE_HOST: {{ .Release.Name }}-timescaledb
  TIMESCALE_PORT: {{ .Values.timescaledb.port | quote }}
  REDIS_HOST: {{ .Release.Name }}-redis
  REDIS_PORT: {{ .Values.redis.port | quote }}
  ALERT_CHANNELS: {{ .Values.config.alertChannels | quote }}
