apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-streamlit
  labels:
    app: {{ .Release.Name }}-streamlit
spec:
  replicas: {{ .Values.streamlit.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-streamlit
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-streamlit
    spec:
      containers:
        - name: streamlit
          image: "{{ .Values.streamlit.image.repository }}:{{ .Values.streamlit.image.tag }}"
          ports:
            - containerPort: {{ .Values.streamlit.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: {{ .Values.streamlit.port }}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.streamlit.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-streamlit
spec:
  selector:
    app: {{ .Release.Name }}-streamlit
  ports:
    - port: {{ .Values.streamlit.port }}
      targetPort: {{ .Values.streamlit.port }}
