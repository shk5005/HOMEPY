name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      typedb:
        image: vaticle/typedb:2.28.0
        ports: ["1729:1729"]
        options: >-
          --health-cmd "echo ok"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        ports: ["5432:5432"]
        env:
          POSTGRES_DB: homepy
          POSTGRES_USER: homepy
          POSTGRES_PASSWORD: homepy
        options: >-
          --health-cmd "pg_isready -U homepy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy homepy/ --strict
      - run: pytest --cov=homepy --cov-fail-under=80 -v || pytest --lf -v
