name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        ports: ["7687:7687", "7474:7474"]
        env:
          NEO4J_AUTH: neo4j/homepy
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        ports: ["5432:5432"]
        env:
          POSTGRES_DB: homepy
          POSTGRES_USER: homepy
          POSTGRES_PASSWORD: homepy
        options: >-
          --health-cmd "pg_isready -U homepy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy homepy/ --strict
      - run: pytest --cov=homepy --cov-fail-under=80 -v || pytest --lf -v
