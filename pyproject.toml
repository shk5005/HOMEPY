[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homepy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typedb-driver>=2.28.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0",
    "prefect>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.54.0",
    "streamlit>=1.66.1",
    "plotly>=7.1.0",
    "folium>=0.20.0",
    "pyvis>=0.3.2",
]

[project.optional-dependencies]
science = [
    "scipy>=1.11",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.36.2",
    "respx>=0.21.0",
    "testcontainers>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["homepy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
